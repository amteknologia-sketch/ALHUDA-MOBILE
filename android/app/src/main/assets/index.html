<!DOCTYPE html>
<html lang="id" data-theme="terang">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="alhuda-app" content="1.4.0">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>ALHUDA MOBILE</title>
<style>
:root{--bg:#f1f1f1;--card:#ffffff;--pri:#10b981;--pri2:#0f6e4f;--soft:#e7f6ef;--line:#e5e7eb;--text:#1f2937;--sub:#6b7280;--chip:#eef2f0;--warn:#fff6d8;--warnb:#f2d27a;--warnt:#7a5b00;--ok:#059669;--danger:#dc2626;--shadow:0 1px 3px rgba(0,0,0,.06),0 1px 2px rgba(0,0,0,.04)}
[data-theme=gelap]{--bg:#0e1412;--card:#17201d;--pri:#34d399;--pri2:#065f46;--soft:#1b2c26;--line:#28362f;--text:#e6eeea;--sub:#95a7a0;--chip:#22302b;--warn:#332c17;--warnb:#6d5a1e;--warnt:#f3d98a;--shadow:none}
[data-theme=pink]{--pri:#ec4899;--pri2:#9d174d;--soft:#fdeef6;--chip:#f9e8f1}
[data-theme=merah]{--pri:#ef4444;--pri2:#991b1b;--soft:#fdecec;--chip:#f8e9e9}
[data-theme=putih]{--bg:#ffffff;--card:#ffffff;--pri:#10b981;--pri2:#1f2937;--soft:#f3f4f6;--chip:#f3f4f6;--line:#e5e7eb;--shadow:0 0 0 1px #e5e7eb}
[data-theme=biru]{--pri:#3b82f6;--pri2:#1e3a8a;--soft:#eaf1fe;--chip:#e9eef8}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-size:14px}
body{overscroll-behavior:none}
button,input,select,textarea{font:inherit;color:inherit}
.app{max-width:520px;margin:0 auto;height:100%;display:flex;flex-direction:column;position:relative;background:var(--bg)}
.hide{display:none!important}
svg.i{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
/* ---------- Top bar ---------- */
.top{background:var(--pri2);color:#fff;padding:10px 14px;display:flex;align-items:center;gap:10px;min-height:56px;flex:none}
.top .tt{flex:1;min-width:0}
.top .t1{font-weight:800;letter-spacing:.4px;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .t2{font-size:10.5px;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:.3px}
.ib{background:rgba(255,255,255,.14);border:0;color:#fff;width:38px;height:38px;border-radius:12px;display:grid;place-items:center;position:relative;cursor:pointer}
.badge{position:absolute;top:-4px;right:-4px;background:#ef4444;color:#fff;font-size:10px;font-weight:700;min-width:18px;height:18px;border-radius:9px;display:grid;place-items:center;padding:0 4px;border:2px solid var(--pri2)}
/* ---------- View ---------- */
.view{flex:1;overflow-y:auto;padding:14px 14px 90px;-webkit-overflow-scrolling:touch}
.card{background:var(--card);border-radius:16px;padding:14px;box-shadow:var(--shadow);margin-bottom:12px}
.sec{display:flex;align-items:center;justify-content:space-between;margin:18px 2px 8px}
.sec h3{margin:0;font-size:14.5px}
.link{color:var(--pri);font-weight:600;font-size:12.5px;background:none;border:0;cursor:pointer;padding:4px}
.muted{color:var(--sub)}.small{font-size:12px}.b{font-weight:700}
.row{display:flex;align-items:center;gap:10px}.grow{flex:1;min-width:0}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* Banner */
.banner{background:linear-gradient(135deg,var(--pri2),var(--pri));color:#fff;border-radius:20px;padding:16px;position:relative;overflow:hidden}
.banner:after{content:"";position:absolute;right:-30px;top:-30px;width:140px;height:140px;border-radius:50%;background:rgba(255,255,255,.08)}
.banner .hi{font-size:12px;opacity:.9}.banner .nm{font-size:18px;font-weight:800;margin:2px 0}
.banner .un{font-size:12px;opacity:.85}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.tag{background:rgba(255,255,255,.18);padding:4px 9px;border-radius:20px;font-size:11px;font-weight:600}
.banner .dt{margin-top:10px;font-size:11.5px;opacity:.9;display:flex;gap:6px;align-items:center}
.av{width:52px;height:52px;border-radius:50%;background:rgba(255,255,255,.2);display:grid;place-items:center;font-weight:800;font-size:18px;overflow:hidden;flex:none}
.av img{width:100%;height:100%;object-fit:cover}
.av.sm{width:40px;height:40px;font-size:14px;background:var(--soft);color:var(--pri2)}
[data-theme=gelap] .av.sm{color:var(--pri)}
/* Quick */
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.qa{background:var(--card);border:0;border-radius:16px;padding:12px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11px;font-weight:600;box-shadow:var(--shadow);cursor:pointer;position:relative;text-align:center}
.qa .ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--soft);color:var(--pri2)}
[data-theme=gelap] .qa .ic{color:var(--pri)}
.qa .badge{top:4px;right:12px;border-color:var(--card)}
/* Stats */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--card);border-radius:16px;padding:12px;box-shadow:var(--shadow);display:flex;gap:10px;align-items:center}
.stat .ic{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;flex:none}
.stat .v{font-size:20px;font-weight:800;line-height:1.1}.stat .l{font-size:11px;color:var(--sub)}
.c1{background:#e0f2fe;color:#0369a1}.c2{background:#ede9fe;color:#6d28d9}.c3{background:#dcfce7;color:#15803d}.c4{background:#ffedd5;color:#c2410c}
[data-theme=gelap] .c1,[data-theme=gelap] .c2,[data-theme=gelap] .c3,[data-theme=gelap] .c4{background:#22302b}
/* Kas */
.kas{background:var(--warn);border:1px solid var(--warnb);border-radius:18px;padding:14px;display:flex;align-items:center;gap:12px;color:var(--warnt)}
.kas .v{font-size:21px;font-weight:800;color:var(--text)}
.svc{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.svc .s{border-radius:14px;padding:11px 9px;cursor:pointer;border:0;text-align:left}
.svc .s .l{font-size:10.5px;opacity:.8}.svc .s .v{font-weight:800;font-size:13px;margin-top:3px}
.p1{background:#e6f6ee;color:#065f46}.p2{background:#eaf0fd;color:#1e40af}.p3{background:#fdeef3;color:#9d174d}
[data-theme=gelap] .p1,[data-theme=gelap] .p2,[data-theme=gelap] .p3{background:#22302b;color:var(--text)}
.ann{border-left:4px solid var(--pri);}
.ann .h{display:flex;gap:8px;align-items:center;font-weight:700;color:var(--pri2)}
[data-theme=gelap] .ann .h{color:var(--pri)}
/* Bottom nav */
.nav{position:absolute;left:0;right:0;bottom:0;background:var(--card);display:flex;border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:5}
.nav button{flex:1;background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;color:var(--sub);padding:4px 0;cursor:pointer;font-weight:600}
.nav button .pill{width:52px;height:28px;border-radius:14px;display:grid;place-items:center}
.nav button.on{color:var(--pri2)}
[data-theme=gelap] .nav button.on{color:var(--pri)}
.nav button.on .pill{background:var(--soft)}
/* Tabs/chips */
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;margin:0 -2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--line);background:var(--card);padding:8px 13px;border-radius:20px;white-space:nowrap;font-size:12.5px;font-weight:600;cursor:pointer;color:var(--sub)}
.chip.on{background:var(--pri2);border-color:var(--pri2);color:#fff}
.seg{display:flex;background:var(--chip);border-radius:12px;padding:4px;margin-bottom:12px}
.seg button{flex:1;border:0;background:none;padding:8px;border-radius:9px;font-weight:600;font-size:12.5px;color:var(--sub);cursor:pointer}
.seg button.on{background:var(--card);color:var(--text);box-shadow:var(--shadow)}
/* Lists */
.list .it{display:flex;gap:12px;align-items:center;padding:11px 2px;border-bottom:1px solid var(--line);cursor:pointer}
.list .it:last-child{border-bottom:0}
.list .it .t{font-weight:600}.list .it .s{font-size:12px;color:var(--sub);margin-top:1px}
.pillx{display:inline-block;background:var(--chip);color:var(--sub);font-size:10.5px;padding:3px 8px;border-radius:10px;font-weight:600;margin:2px 3px 0 0}
.st{font-size:11px;font-weight:700;padding:3px 9px;border-radius:10px}
.st.H,.st.ok{background:#dcfce7;color:#15803d}.st.I{background:#e0f2fe;color:#0369a1}.st.S{background:#fef3c7;color:#b45309}.st.A,.st.no{background:#fee2e2;color:#b91c1c}.st.w{background:#fef3c7;color:#b45309}
/* Forms */
.f{margin-bottom:12px}.f label{display:block;font-size:12px;font-weight:600;color:var(--sub);margin-bottom:5px}
.in{width:100%;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:11px 12px;outline:none;font-size:14px}
.in:focus{border-color:var(--pri);box-shadow:0 0 0 3px color-mix(in srgb,var(--pri) 18%,transparent)}
.in[readonly],.in:disabled{background:var(--chip);color:var(--sub)}
textarea.in{min-height:90px;resize:vertical}
.btn{border:0;background:var(--pri2);color:#fff;border-radius:12px;padding:12px 16px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.full{width:100%}.btn.sec{background:var(--soft);color:var(--pri2)}.btn.red{background:#fee2e2;color:#b91c1c}.btn.sm{padding:8px 12px;font-size:12.5px;border-radius:10px}
[data-theme=gelap] .btn.sec{color:var(--pri)}
.btn:disabled{opacity:.6}
.fab{position:absolute;right:16px;bottom:84px;width:54px;height:54px;border-radius:18px;background:var(--pri2);color:#fff;border:0;display:grid;place-items:center;box-shadow:0 6px 16px rgba(0,0,0,.2);z-index:4;cursor:pointer}
.checks{display:flex;flex-wrap:wrap;gap:6px}
.checks label{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:10px;padding:7px 10px;font-size:12.5px;color:var(--text);margin:0;font-weight:500;cursor:pointer}
.checks input{accent-color:var(--pri2)}
.pw{position:relative}.pw .eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);background:none;border:0;color:var(--sub);padding:8px;cursor:pointer}
/* Absen toggles */
.tg{display:flex;gap:4px}
.tg button{width:32px;height:32px;border-radius:9px;border:1px solid var(--line);background:var(--card);font-weight:700;font-size:12px;color:var(--sub);cursor:pointer}
.tg button.on.H{background:#16a34a;color:#fff;border-color:#16a34a}.tg button.on.I{background:#0284c7;color:#fff;border-color:#0284c7}
.tg button.on.S{background:#d97706;color:#fff;border-color:#d97706}.tg button.on.A{background:#dc2626;color:#fff;border-color:#dc2626}
/* Rekap ring */
.ring{width:96px;height:96px;border-radius:50%;display:grid;place-items:center;flex:none}
.ring>div{width:76px;height:76px;border-radius:50%;background:var(--card);display:grid;place-items:center;text-align:center}
.ring b{font-size:19px}
.mini4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;flex:1}
.mini4 div{background:var(--chip);border-radius:10px;padding:8px 4px;text-align:center}.mini4 b{display:block;font-size:16px}.mini4 span{font-size:10.5px;color:var(--sub)}
/* Table */
.tbl{width:100%;border-collapse:collapse;font-size:12.5px}
.tbl th{background:var(--soft);color:var(--pri2);padding:8px 6px;text-align:left;font-size:11.5px}
[data-theme=gelap] .tbl th{color:var(--pri)}
.tbl td{padding:8px 6px;border-bottom:1px solid var(--line)}
.tbl .c{text-align:center}.tbl .r{text-align:right}
/* Month grid */
.months{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mo{border-radius:12px;padding:10px;border:1px solid var(--line);background:var(--card);cursor:pointer;text-align:left}
.mo .n{font-weight:700;font-size:12.5px}.mo .a{font-size:11px;color:var(--sub);margin-top:3px}
.mo.lunas{background:#dcfce7;border-color:#86efac}.mo.kurang{background:#fef3c7;border-color:#fcd34d}
[data-theme=gelap] .mo.lunas{background:#14361f}[data-theme=gelap] .mo.kurang{background:#3a2f12}
.bar{height:10px;background:var(--chip);border-radius:6px;overflow:hidden}.bar>div{height:100%;background:var(--pri)}
/* Sheet/modal */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.42);z-index:20;display:flex;align-items:flex-end;justify-content:center;animation:fd .15s}
.sheet{background:var(--bg);width:100%;max-width:520px;max-height:92vh;border-radius:22px 22px 0 0;display:flex;flex-direction:column;animation:up .2s ease-out}
.sheet .sh{display:flex;align-items:center;padding:14px 16px 8px;gap:8px}.sheet .sh h3{margin:0;flex:1;font-size:16px}
.sheet .sb{padding:6px 16px 22px;overflow-y:auto}
.xb{background:var(--chip);border:0;width:34px;height:34px;border-radius:10px;display:grid;place-items:center;cursor:pointer;color:var(--text)}
@keyframes up{from{transform:translateY(40px);opacity:.4}}@keyframes fd{from{opacity:0}}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:#111827;color:#fff;padding:11px 16px;border-radius:12px;font-size:13px;z-index:40;max-width:90%;box-shadow:0 6px 20px rgba(0,0,0,.25);animation:fd .2s}
.toast.err{background:#b91c1c}.toast.ok{background:#047857}
.net{display:flex;align-items:center;gap:8px;padding:8px 14px;font-size:12px;flex:none;cursor:pointer}
.net svg{width:16px;height:16px}
.net.off{background:#374151;color:#fff}.net.sync{background:#dbeafe;color:#1e3a8a}.net.err{background:#fee2e2;color:#991b1b}
.bb.pend{opacity:.75}
.prog{position:fixed;top:0;left:0;height:3px;background:var(--pri);z-index:50;width:0;transition:width .3s}
.empty{text-align:center;color:var(--sub);padding:28px 10px}
.empty svg{width:42px;height:42px;opacity:.5;margin-bottom:6px}
.sk{background:linear-gradient(90deg,var(--chip),var(--card),var(--chip));background-size:200% 100%;animation:sk 1.2s infinite;border-radius:14px;height:70px;margin-bottom:10px}
@keyframes sk{to{background-position:-200% 0}}
/* Login */
.login{min-height:100%;display:flex;flex-direction:column;justify-content:flex-start;padding:0 0 28px;background:var(--bg)}
.login .hd{background:var(--pri2);padding:calc(56px + 6vh) 24px 64px;border-radius:0 0 32px 32px}
.login .card{margin:-44px 20px 0}
.login .lg{width:96px;height:96px;border-radius:28px;background:#fff;margin:0 auto 12px;display:grid;place-items:center;box-shadow:0 8px 24px rgba(0,0,0,.18);overflow:hidden}
.login .lg img{width:84px;height:84px;object-fit:contain}
.login h1{color:#fff;text-align:center;margin:0;font-size:22px;letter-spacing:1px}
.login .yy{color:#fff;opacity:.9;text-align:center;font-size:11.5px;margin:4px 0 22px;letter-spacing:.4px}
.login .card{padding:20px}
/* Chat */
.msgs{display:flex;flex-direction:column;gap:6px;padding-bottom:70px}
.bb{max-width:80%;padding:9px 12px;border-radius:16px;font-size:13.5px;line-height:1.4;white-space:pre-wrap;word-wrap:break-word}
.bb .tm{font-size:10px;opacity:.65;margin-top:3px;text-align:right}
.bb.me{align-self:flex-end;background:var(--pri2);color:#fff;border-bottom-right-radius:5px}
.bb.ot{align-self:flex-start;background:var(--card);box-shadow:var(--shadow);border-bottom-left-radius:5px}
.dsep{align-self:center;font-size:11px;color:var(--sub);background:var(--chip);padding:3px 10px;border-radius:10px;margin:6px 0}
.composer{position:absolute;left:0;right:0;bottom:0;background:var(--card);padding:8px 10px calc(8px + env(safe-area-inset-bottom));display:flex;gap:8px;border-top:1px solid var(--line);z-index:6}
.composer textarea{flex:1;border:1px solid var(--line);border-radius:20px;padding:10px 14px;resize:none;height:42px;max-height:110px;background:var(--bg);outline:none}
.composer button{width:42px;height:42px;border-radius:50%;border:0;background:var(--pri2);color:#fff;display:grid;place-items:center;cursor:pointer}
.ub{background:var(--pri);color:#fff;font-size:10.5px;font-weight:700;min-width:20px;height:20px;border-radius:10px;display:grid;place-items:center;padding:0 5px}
.swatch{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.sw{border:2px solid var(--line);border-radius:14px;padding:10px;cursor:pointer;background:var(--card);text-align:center;font-weight:600;font-size:12.5px}
.sw.on{border-color:var(--pri)}
.sw .dots{display:flex;justify-content:center;gap:4px;margin-bottom:6px}.sw .dots i{width:16px;height:16px;border-radius:50%;display:block;border:1px solid rgba(0,0,0,.08)}
.menu .it{padding:14px 4px}
.menu .it .ic{width:36px;height:36px;border-radius:11px;background:var(--soft);color:var(--pri2);display:grid;place-items:center;flex:none}
[data-theme=gelap] .menu .it .ic{color:var(--pri)}
.search{position:relative;margin-bottom:10px}.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--sub)}
.search .in{padding-left:40px}
.grp{font-size:11.5px;font-weight:700;color:var(--pri2);margin:12px 0 4px;text-transform:uppercase;letter-spacing:.4px}
[data-theme=gelap] .grp{color:var(--pri)}
.sess{border-left:3px solid var(--pri);padding-left:10px;margin-bottom:12px}
.sess .jam{font-weight:800;font-size:13px}.sess .ent{background:var(--chip);border-radius:12px;padding:10px;margin-top:6px;display:flex;gap:8px;align-items:center}
.ibtn{background:var(--chip);border:0;width:32px;height:32px;border-radius:9px;display:grid;place-items:center;cursor:pointer;color:var(--text)}
.ibtn svg{width:16px;height:16px}
</style>
</head>
<body>
<div class="prog" id="prog"></div>
<div class="app" id="app"></div>

<script>
/* =============================================================
 *  ALHUDA MOBILE — Frontend
 * ============================================================= */
const IC = {
  home:'<path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h5v-6h4v6h5V9.5"/>',
  users:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.6-3.6 3.3-5.5 6.5-5.5s5.9 1.9 6.5 5.5"/><path d="M16 4.6a3.5 3.5 0 0 1 0 6.8M18 14.8c2 .8 3.2 2.5 3.5 5.2"/>',
  check:'<rect x="5" y="3.5" width="14" height="18" rx="2.5"/><path d="M9 3.5h6v3H9z"/><path d="m9 13.5 2 2 4-4.5"/>',
  book:'<path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v15H6.5A2.5 2.5 0 0 0 4 20.5z"/><path d="M4 20.5A2.5 2.5 0 0 0 6.5 23H20v-5"/><path d="M8 7.5h8M8 11h6"/>',
  gear:'<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>',
  chat:'<path d="M21 11.5a8.4 8.4 0 0 1-12.2 7.5L3 20.5l1.6-5.2A8.4 8.4 0 1 1 21 11.5z"/><path d="M8.5 10.5h7M8.5 13.5h4.5"/>',

/* ---------- util ---------- */
const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
const esc = s => String(s === undefined || s === null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const rp = n => 'Rp ' + Math.round(+n || 0).toLocaleString('id-ID');
const BLN = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
const pad2 = n => String(n).padStart(2, '0');
function todayStr() { const d = new Date(); return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); }
function monthStr() { return todayStr().slice(0, 7); }
function tgl(s) { const m = String(s || '').match(/^(\d{4})-(\d{2})-(\d{2})/); return m ? (+m[3]) + ' ' + BLN[+m[2] - 1].slice(0, 3) + ' ' + m[1] : (s || '-'); }
function jam(s) { const m = String(s || '').match(/(\d{2}:\d{2})/); return m ? m[1].replace(':', '.') : ''; }
function inisial(n) { return String(n || '?').replace(/^(tgk\.?|m\.|t\.)\s*/i, '').split(/\s+/).slice(0, 2).map(x => x[0] || '').join('').toUpperCase(); }
function avatar(u, cls) { return '<div class="av ' + (cls || '') + '">' + (u && u.foto ? '<img src="' + esc(u.foto) + '" alt="" referrerpolicy="no-referrer" onerror="this.parentNode.textContent=\'' + esc(inisial(u.nama)) + '\'">' : esc(inisial(u && u.nama))) + '</div>'; }
const REG = []; const reg = o => (REG.push(o), REG.length - 1);
const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return S.mem[k] || null; } },
  set(k, v) { try { v === null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch (e) { S.mem[k] = v; } }
};
const BR = window.AndroidBridge || null;

/* ---------- state ---------- */
const S = { token: null, B: null, tab: 'beranda', stack: [], ui: {}, rt: 0, mem: {}, unread: 0, lastNotif: '', polls: {} };
const me = () => S.B.user;
const P = () => S.B.perms;
const isSantri = () => me().tipe === 'Santri';

/* ---------- API ---------- */
let pending = 0;
function prog(on) { pending += on ? 1 : -1; const p = $('#prog'); p.style.width = pending > 0 ? '70%' : '100%'; if (pending <= 0) { pending = 0; setTimeout(() => { if (!pending) p.style.width = '0'; }, 250); } }
const API_URL = (function () { try { return (BR && BR.apiUrl && BR.apiUrl()) || window.ALHUDA_API_URL || ''; } catch (e) { return ''; } })();
const HAS_GAS = !!(window.google && google.script && google.script.run);
function handleRes(r, res, rej) {
  if (r && r.ok) return res(r.data);
  const m = r ? r.error : 'Terjadi kesalahan';
  if (m === 'SESSION') { logout(true); rej(new Error('Sesi berakhir, silakan login kembali.')); } else rej(new Error(m));
}
const NATIVE = !!(BR && BR.call);
const PENDING = {}; let SEQ = 0;
window.__nativeRes = function (id, txt) { const p = PENDING[id]; if (p) { delete PENDING[id]; p(txt); } };
/** Terjemahkan balasan server yang bukan JSON menjadi pesan yang jelas. */
function parseServer(txt) {
  txt = String(txt || '').trim();
  if (txt.charAt(0) === '{') { try { return JSON.parse(txt); } catch (e) {} }
  let m = 'Balasan server tidak valid. Coba lagi beberapa saat.';
  if (/doPost/i.test(txt)) m = 'Server belum diperbarui: ganti Code.gs di Apps Script dengan versi terbaru, lalu Terapkan → Kelola deployment → Versi baru.';
  else if (/accounts\.google|ServiceLogin|signin/i.test(txt)) m = 'Web App belum dibuka untuk umum: di Kelola deployment, atur "Yang memiliki akses" = Siapa saja.';
  else if (/<html|<!doctype/i.test(txt)) m = 'Server mengirim halaman, bukan data. Pastikan URL Web App benar dan Code.gs terbaru sudah dideploy (Versi baru).';
  return { ok: false, error: m };
}
function netErr(m) { const e = new Error(m || 'Tidak dapat terhubung ke server. Periksa koneksi internet lalu coba lagi.'); e.net = true; return e; }
function rawApi(action, params, silent) {
  if (!HAS_GAS && NATIVE) {
    // Mode aplikasi Android: permintaan dikirim oleh aplikasi (bebas masalah CORS)
    if (!silent) prog(true);
    return new Promise((res, rej) => {
      const id = 'c' + (++SEQ);
      PENDING[id] = txt => {
        if (!silent) prog(false);
        const r = parseServer(txt);
        if (r && r.ok === false && /^NET:/.test(r.error || '')) return rej(netErr());
        handleRes(r, res, rej);
      };
      try { BR.call(id, JSON.stringify({ token: S.token, action: action, params: params || {} })); }
      catch (e) { delete PENDING[id]; if (!silent) prog(false); rej(netErr('Gagal memanggil server.')); }
    });
  }
  if (!HAS_GAS && API_URL) {
    // Mode aplikasi Android: panggil Web App langsung (tanpa iframe Google)
    if (!silent) prog(true);
    return fetch(API_URL, { method: 'POST', redirect: 'follow', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ token: S.token, action: action, params: params || {} }) })
      .then(r => r.text())
      .catch(e => { throw netErr(); })
      .then(t => new Promise((res, rej) => handleRes(parseServer(t), res, rej)))
      .finally(() => { if (!silent) prog(false); });
  }
  return new Promise((res, rej) => {
    if (!HAS_GAS) return rej(new Error('Aplikasi harus dibuka melalui URL Web App Google Apps Script.'));
    if (!silent) prog(true);
    google.script.run
      .withSuccessHandler(r => { if (!silent) prog(false); handleRes(r, res, rej); })
      .withFailureHandler(e => { if (!silent) prog(false); rej(netErr()); })
      .api(S.token, action, params || {});
  });
}

/* =============================================================
 *  MODE OFFLINE
 *  - Data yang pernah dibuka disimpan di HP → bisa dibuka tanpa internet.
 *  - Perubahan saat offline masuk ANTREAN dan dikirim otomatis saat online
 *    (di APK juga dikirim di latar belakang walau aplikasi ditutup).
 *  - Setiap perubahan membawa _cid unik → server tidak mencatat dua kali.
 * ============================================================= */
const WRITE_RE = /\.(save|delete|send|kembali|naik)$/;
const ONLINE_ONLY = { 'profil.password': 'Ganti kata sandi', 'profil.photo': 'Unggah foto profil', 'raport.pdf': 'Cetak PDF', 'iuran.pdf': 'Cetak PDF', 'tahunan.pdf': 'Cetak PDF', 'settings.save': 'Mengubah pengaturan aplikasi', 'logo.upload': 'Mengganti logo', 'logo.reset': 'Mengganti logo' };
S.online = true;
function isOnline() { try { if (BR && BR.isOnline) return !!BR.isOnline(); } catch (e) {} return navigator.onLine !== false; }
function uname() { return (S.B && S.B.user && S.B.user.username) || store.get('alhuda_uname') || '_'; }
function nowLocal() { const d = new Date(); return todayStr() + ' ' + pad2(d.getHours()) + ':' + pad2(d.getMinutes()) + ':' + pad2(d.getSeconds()); }
function cid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 9); }

/* --- cache baca --- */
const CP = () => 'c:' + uname() + ':';
function ckey(action, params) { return CP() + action + ':' + JSON.stringify(params || {}); }
function cget(k) { const t = store.get(k); if (t === null || t === undefined) return undefined; try { return JSON.parse(t); } catch (e) { return undefined; } }
function cset(k, v) {
  const t = JSON.stringify(v);
  try { localStorage.setItem(k, t); }
  catch (e) { try { Object.keys(localStorage).filter(x => x.indexOf('c:') === 0 && x.indexOf(':boot:') < 0).forEach(x => localStorage.removeItem(x)); localStorage.setItem(k, t); } catch (e2) {} }
}
/** Ubah semua cache suatu aksi yang cocok dengan syarat (untuk tampilan langsung berubah saat offline). */
function editCache(action, match, fn) {
  const pre = CP() + action + ':';
  try {
    Object.keys(localStorage).forEach(k => {
      if (k.indexOf(pre) !== 0) return;
      let prm = {}; try { prm = JSON.parse(k.slice(pre.length)); } catch (e) { return; }
      if (!match(prm)) return;
      const v = cget(k); if (v === undefined) return;
      const nv = fn(v, prm); cset(k, nv === undefined ? v : nv);
    });
  } catch (e) {}
}

/* --- antrean kirim --- */
const Q = {
  list() { try { const t = (BR && BR.getQueue) ? BR.getQueue() : store.get('alhuda_queue'); return JSON.parse(t || '[]') || []; } catch (e) { return []; } },
  save(l) { const t = JSON.stringify(l); try { if (BR && BR.setQueue) BR.setQueue(t); else store.set('alhuda_queue', t); } catch (e) {} netBar(); },
  add(it) { const l = this.list(); l.push(it); this.save(l); },
  remove(id) { this.save(this.list().filter(x => x.id !== id)); },
  mark(id, err) { this.save(this.list().map(x => x.id === id ? Object.assign(x, { err: err }) : x)); },
  mine() { const u = uname(); return this.list().filter(x => x.user === u); }
};

async function api(action, params, silent) {
  params = params || {};
  if (action === 'login' || action === 'publicInfo') return rawApi(action, params, silent);
  if (WRITE_RE.test(action) || ONLINE_ONLY[action]) return writeApi(action, params, silent);
  return readApi(action, params, silent);
}
async function readApi(action, params, silent) {
  const cacheable = !params.since;
  const k = ckey(action, params);
  if (isOnline()) {
    if (Q.mine().some(x => !x.err)) await flush(true);
    try { const d = await rawApi(action, params, silent); if (cacheable) cset(k, d); setOnline(true); return d; }
    catch (e) { if (!e.net) throw e; setOnline(false); }
  } else setOnline(false);
  const c = cacheable ? cget(k) : undefined;
  if (c !== undefined) return c;
  if (!cacheable) return [];
  throw new Error('Anda sedang offline dan data ini belum pernah dibuka sebelumnya. Sambungkan internet lalu coba lagi.');
}
async function writeApi(action, params, silent) {
  if (ONLINE_ONLY[action]) {
    if (!isOnline()) throw new Error(ONLINE_ONLY[action] + ' memerlukan koneksi internet.');
    return rawApi(action, params, silent);
  }
  params = Object.assign({}, params, { _cid: params._cid || cid() });
  if (isOnline() && !Q.mine().some(x => !x.err)) {
    try { const d = await rawApi(action, params, silent); setOnline(true); afterWrite(action, params, d); return d; }
    catch (e) { if (!e.net) throw e; setOnline(false); }
  }
  Q.add({ id: params._cid, user: uname(), action: action, params: params, waktu: nowLocal() });
  const opt = patchLocal(action, params);
  if (isOnline()) setTimeout(() => flush(), 300);
  return Object.assign({ _queued: true }, opt || {});
}
function afterWrite(action, params, d) {
  if (action === 'profil.save' && d && d.token) { setToken(d.token); if (S.B) S.B.user = d.user; store.set('alhuda_uname', d.user.username); }
}
async function flush(quiet) {
  if (S.flushing || !S.token) return;
  const items = Q.mine().filter(x => !x.err);
  if (!items.length || !isOnline()) return;
  S.flushing = true; netBar();
  let sent = 0, fail = 0;
  try {
    for (const it of items) {
      try { const d = await rawApi(it.action, it.params, true); afterWrite(it.action, it.params, d); Q.remove(it.id); sent++; setOnline(true); }
      catch (e) { if (e.net) { setOnline(false); break; } if (!S.token) break; Q.mark(it.id, e.message); fail++; }
    }
  } finally { S.flushing = false; netBar(); }
  if (sent) { toast(sent + ' perubahan offline berhasil dikirim ke server.', 'ok'); if (!quiet && S.B && !$('.scrim') && !S.thread) refresh(); }
  if (fail) toast(fail + ' perubahan ditolak server. Buka "Antrean Offline" untuk melihat.', 'err');
}

/* --- perubahan tampilan lokal (optimistis) saat perubahan masih di antrean --- */
function patchLocal(a, p) {
  const eq = (x, y) => String(x === undefined ? '' : x) === String(y === undefined ? '' : y);
  if (a === 'chat.send') {
    const m = { id: p._cid, dariSaya: true, pesan: p.pesan, waktu: nowLocal(), dibaca: false, pending: true };
    editCache('chat.thread', x => eq(x.with, p.to) && !x.since, v => v.concat([m]));
    editCache('chat.contacts', () => true, v => v.map(c => eq(c.username, p.to) ? Object.assign(c, { last: { pesan: p.pesan, waktu: m.waktu, dariSaya: true } }) : c));
    return m;
  }
  if (a === 'absen.save') {
    const st = {}; (p.items || []).forEach(i => st[i.username] = i.status);
    editCache('absen.form', x => eq(x.jenis, p.jenis) && eq(x.tanggal, p.tanggal) && eq(x.kelas, p.kelas) && eq(x.sesi, p.sesi),
      v => { v.items.forEach(i => { if (st[i.username]) i.status = st[i.username]; }); return v; });
  }
  if (a === 'nilai.save') {
    const nv = {}; (p.items || []).forEach(i => nv[i.username] = i.nilai);
    editCache('nilai.grid', x => eq(x.kelas, p.kelas) && eq(x.mapel, p.mapel) && eq(x.tahun_ajaran, p.tahun_ajaran) && eq(x.semester, p.semester),
      v => v.map(i => nv[i.username] !== undefined ? Object.assign(i, { nilai: nv[i.username] }) : i));
  }
  if (a === 'iuran.save' || a === 'iuran.delete') {
    editCache('iuran.get', x => a === 'iuran.delete' || (eq(x.username, p.username) && eq(x.tahun, p.tahun)), v => {
      v.bulan.forEach(b => {
        if (a === 'iuran.save' && b.bulan === +p.bulan) Object.assign(b, { jumlah: +p.jumlah || 0, tanggal: p.tanggal, keterangan: p.keterangan, lunas: (+p.jumlah || 0) >= v.nominal, id: b.id || p._cid });
        if (a === 'iuran.delete' && b.id === p.id) Object.assign(b, { jumlah: 0, tanggal: '', lunas: false, id: '' });
      });
      v.totalBayar = v.bulan.reduce((t, b) => t + b.jumlah, 0); v.lunas = v.bulan.filter(b => b.lunas).length; return v;
    });
  }
  if (a === 'tahunan.save') {
    editCache('tahunan.get', x => eq(x.username, p.username) && (!x.tahun_ajaran || eq(x.tahun_ajaran, p.tahun_ajaran)), v => {
      if (!eq(v.tahun_ajaran, p.tahun_ajaran)) return v;
      v.items.push({ id: p._cid, tanggal: p.tanggal, jumlah: +p.jumlah || 0, keterangan: (p.keterangan || 'Pembayaran') + ' (menunggu dikirim)' });
      v.total += +p.jumlah || 0; v.sisa = Math.max(0, v.nominal - v.total); v.lunas = v.total >= v.nominal; return v;
    });
  }
  if (a === 'saldo.save') {
    editCache('saldo.get', x => eq(x.username, p.username), v => {
      const j = +p.jumlah || 0; v.saldo += p.jenis === 'Keluar' ? -j : j;
      v.items.unshift({ id: p._cid, tanggal: p.tanggal || nowLocal(), jenis: p.jenis, jumlah: j, keterangan: (p.keterangan || '') + ' (menunggu dikirim)' }); return v;
    });
  }
  if (a === 'izinKeluar.save' || a === 'izinPulang.save') {
    const u = S.B.users.find(x => eq(x.username, p.username)) || {};
    const it = Object.assign({ id: p._cid, nama: u.nama || p.username, kelas: u.kelas || '', status: 'Menunggu dikirim', tanggal: p.tanggal || todayStr() }, p);
    editCache(a.split('.')[0] + '.list', () => true, v => [it].concat(v));
  }
  if (a === 'izinKeluar.kembali' || a === 'izinPulang.kembali') {
    editCache(a.split('.')[0] + '.list', () => true, v => v.map(r => r.id === p.id ? Object.assign(r, { status: 'Kembali', jam_kembali: p.jam || r.jam_kembali, tgl_kembali: p.tanggal || r.tgl_kembali }) : r));
  }
  if (a === 'roster.save' || a === 'roster.delete') {
    editCache('roster.list', () => true, (v, x) => {
      let l = v.filter(r => r.id !== p.id);
      if (a === 'roster.save' && (!x.kelas || eq(x.kelas, p.kelas)) && (!x.guru || eq(x.guru, p.guru)))
        l.push({ id: p.id || p._cid, kelas: p.kelas, sesi: p.sesi, hari: p.hari || 'Setiap Hari', mapel: p.mapel, guru: p.guru, guruNama: userName(p.guru) });
      return l;
    });
  }
  if (a === 'pengumuman.save' && !p.id) {
    const n = { id: p._cid, tanggal: nowLocal(), judul: p.judul || 'Pengumuman', isi: p.isi, oleh: (S.B.user || {}).nama };
    editCache('pengumuman.list', () => true, v => [n].concat(v));
  }
  if (a === 'profil.save' && S.B) {
    const u = Object.assign({}, S.B.user, p); delete u._cid; S.B.user = u;
    return { user: u, token: S.token };
  }
  return null;
}

/* --- status jaringan & banner --- */
function setOnline(v) { if (S.online !== v) { S.online = v; netBar(); if (v) setTimeout(() => flush(), 200); } }
function netBar() {
  const el = $('#net'); if (!el) return;
  const pend = S.B ? Q.mine() : [];
  const ok = pend.filter(x => !x.err).length, bad = pend.length - ok;
  let html = '', cls = '';
  if (!S.online) { cls = 'off'; html = ic('wifioff') + '<span class="grow"><b>Anda sedang offline.</b> ' + (ok ? ok + ' perubahan menunggu dikirim.' : 'Data ditampilkan dari penyimpanan HP.') + '</span>'; }
  else if (S.flushing) { cls = 'sync'; html = ic('repeat') + '<span class="grow">Mengirim ' + ok + ' perubahan ke server…</span>'; }
  else if (ok) { cls = 'sync'; html = ic('repeat') + '<span class="grow">' + ok + ' perubahan menunggu dikirim.</span><b>Kirim</b>'; }
  else if (bad) { cls = 'err'; html = ic('info') + '<span class="grow">' + bad + ' perubahan ditolak server.</span><b>Lihat</b>'; }
  el.className = 'net ' + cls; el.classList.toggle('hide', !html); el.innerHTML = html;
}
function openQueue() { push('Antrean Offline', pQueue, { sub: 'Perubahan yang belum terkirim' }); }
function qLabel(it) {
  const p = it.params || {}, n = un => userName(un || '');
  const L = {
    'chat.send': () => 'Pesan ke ' + n(p.to) + ': "' + String(p.pesan).slice(0, 40) + '"',

    'iuran.delete': () => 'Hapus pembayaran iuran',
    'tahunan.save': () => 'Uang tahunan • ' + n(p.username) + ' • ' + rp(p.jumlah),
    'tahunan.delete': () => 'Hapus pembayaran uang tahunan',
    'saldo.save': () => 'Saldo ' + p.jenis + ' • ' + n(p.username) + ' • ' + rp(p.jumlah),
    'izinKeluar.save': () => 'Izin keluar • ' + n(p.username), 'izinPulang.save': () => 'Perizinan pulang • ' + n(p.username),
    'izinKeluar.kembali': () => 'Tandai kembali (izin keluar)', 'izinPulang.kembali': () => 'Tandai kembali (izin pulang)',
    'roster.save': () => 'Roster ' + p.mapel + ' • ' + p.kelas, 'roster.delete': () => 'Hapus roster',
    'mengulang.save': () => 'Daftar mengulang malam', 'pengumuman.save': () => 'Pengumuman: ' + (p.judul || ''),
    'users.save': () => 'Data pengguna: ' + p.nama, 'profil.save': () => 'Biodata saya', 'raport.naik': () => 'Status naik kelas • ' + n(p.username)
  };
  return (L[it.action] || (() => it.action))();
}
async function pQueue() {
  const l = Q.mine();
  view('<div class="card row" style="background:var(--soft)">' + ic(S.online ? 'repeat' : 'wifioff') + '<div class="grow small">' + (S.online ? 'Perubahan dikirim otomatis berurutan.' : 'Anda sedang offline. Perubahan akan dikirim otomatis saat internet tersambung.') + '</div>' +
    (S.online && l.some(x => !x.err) ? '<button class="btn sm" onclick="flush().then(refresh)">Kirim sekarang</button>' : '') + '</div>' +
    (l.length ? '<div class="card"><div class="list">' + l.map(it => '<div class="it" style="cursor:default"><div class="grow"><div class="t">' + esc(qLabel(it)) + '</div><div class="s">' + tgl(it.waktu) + ' ' + jam(it.waktu) +
      (it.err ? ' • <b style="color:#b91c1c">Ditolak: ' + esc(it.err) + '</b>' : ' • menunggu') + '</div></div>' +
      '<button class="ibtn" onclick="hapusAntrean(\'' + it.id + '\')">' + ic('trash') + '</button></div>').join('') + '</div></div>'
      : empty('Semua perubahan sudah terkirim.', 'check')));
}
async function hapusAntrean(id) { if (await ask('Batalkan perubahan ini? Perubahan tidak akan dikirim ke server.', 'Batalkan')) { Q.remove(id); refresh(); } }
window.addEventListener('online', () => { setOnline(isOnline()); });
window.addEventListener('offline', () => setOnline(false));

function toast(msg, type) {
  const t = document.createElement('div'); t.className = 'toast ' + (type || ''); t.textContent = msg;
  document.body.appendChild(t); setTimeout(() => t.remove(), 3200);
}
async function run(fn, okMsg) {
  try { const r = await fn(); if (r && r._queued) toast('Tersimpan di HP. Akan dikirim otomatis saat online.', 'ok'); else if (okMsg) toast(okMsg, 'ok'); return r; } catch (e) { toast(e.message, 'err'); throw e; }
}
function busy(btn, on) { if (!btn) return; btn.disabled = on; if (on) { btn.dataset.t = btn.innerHTML; btn.innerHTML = 'Memproses...'; } else if (btn.dataset.t) btn.innerHTML = btn.dataset.t; }

function togglePw(id, b) { const i = $('#' + id); const show = i.type === 'password'; i.type = show ? 'text' : 'password'; b.innerHTML = ic(show ? 'eyeoff' : 'eye'); }
async function doLogin() {
  const u = $('#lu').value.trim(), p = $('#lp').value;
  if (!u || !p) return toast('Username dan password wajib diisi.', 'err');
  const b = $('#lb'); busy(b, true);
  try {
    if (!isOnline()) throw new Error('Anda sedang offline. Login memerlukan koneksi internet.');
    const r = await api('login', { username: u, password: p });
    setToken(r.token); store.set('alhuda_uname', r.user.username);
    await startApp();
  } catch (e) { toast(e.message, 'err'); } finally { busy(b, false); }

function setToken(t) { S.token = t; store.set('alhuda_token', t); try { BR && BR.setToken && BR.setToken(t || ''); } catch (e) {} }

function savePdf(r) {
  if (BR && BR.savePdf) { try { BR.savePdf(r.base64, r.name); toast('PDF siap dibuka / dibagikan.', 'ok'); return; } catch (e) {} }
  const bin = atob(r.base64), arr = new Uint8Array(bin.length);

  $('#pws', d).onclick = async e => { busy(e.target, true); try { const r = await run(() => api('profil.password', { lama: $('#pl').value, baru: $('#pb').value, ulang: $('#pu').value }), 'Kata sandi berhasil diubah.'); setToken(r.token); closeSheet(); } catch (x) {} busy(e.target, false); };
}
function openBiodata() { push('Biodata Pengguna', pBiodata); }
function pBiodata() {
  const u = me(), s = isSantri();
  const kuliah = u.kuliah === 'Ya';
  view('<div class="card" style="text-align:center"><div style="display:inline-block;position:relative">' + avatar(u, 'sm').replace('av sm', 'av sm" id="bav" style="width:96px;height:96px;font-size:28px') +
    '<label style="position:absolute;right:-2px;bottom:-2px;background:var(--pri2);color:#fff;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;cursor:pointer">' + ic('edit') + '<input type="file" accept="image/*" class="hide" onchange="uploadFoto(this)"></label></div><div class="small muted" style="margin-top:8px">Ketuk ikon untuk mengganti foto profil</div></div>' +
    '<div class="card">' + fld('Nama', inp('bn', u.nama)) + fld(s ? 'NIS' : 'NIP', inp('bi', u.nis_nip, 'inputmode="numeric" placeholder="Kosongkan jika tidak ada"')) +
    fld('Username', inp('bu', u.username, 'autocapitalize="none" oninput="this.value=this.value.replace(/\\s/g,\'\').toLowerCase()"')) +
    fld(s ? 'Kelas' : 'Kabag', inp('bk', s ? u.kelas : u.kabag, 'readonly')) +
    fld('Alamat / Kota Asal', inp('ba', u.asal)) + fld('Asal Sekolah', inp('bs', u.asal_sekolah)) +
    fld('Kuliah', sel('bq', [['Tidak', 'Tidak'], ['Ya', 'Ya']], kuliah ? 'Ya' : 'Tidak', 'onchange="$(\'#kul\').classList.toggle(\'hide\',this.value!==\'Ya\')"')) +
    '<div id="kul" class="' + (kuliah ? '' : 'hide') + '">' + fld('Kampus', inp('bc', u.kampus)) + fld('Jurusan', inp('bj', u.jurusan)) + '</div>' +
    '<div class="row"><div class="grow">' + fld('Tahun Masuk ke Dayah', inp('bt', u.tahun_masuk, 'inputmode="numeric"')) + '</div><div class="grow">' + fld('Kelas Masuk ke Dayah', inp('bm', u.kelas_masuk)) + '</div></div>' +
    '<button class="btn full" onclick="simpanBiodata(this)">Simpan Biodata</button></div>');
}
async function simpanBiodata(btn) {
  busy(btn, true);
  try {
    const r = await run(() => api('profil.save', { nama: val('bn'), nis_nip: val('bi'), username: val('bu'), asal: val('ba'), asal_sekolah: val('bs'), kuliah: val('bq'), kampus: val('bc'), jurusan: val('bj'), tahun_masuk: val('bt'), kelas_masuk: val('bm') }), 'Biodata disimpan.');
    setToken(r.token); S.B.user = r.user; topBar();
  } catch (e) {}
  busy(btn, false);
}
function uploadFoto(input) {
  const f = input.files && input.files[0]; if (!f) return;
  const rd = new FileReader();
  rd.onload = () => {
    const img = new Image();
    img.onload = async () => {
      const max = 480, sc = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas'); c.width = Math.round(img.width * sc); c.height = Math.round(img.height * sc);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      const data = c.toDataURL('image/jpeg', .85);
      $('#bav').innerHTML = '<img src="' + data + '">';
      try { const r = await run(() => api('profil.photo', { data: data, mime: 'image/jpeg' }), 'Foto profil diperbarui.'); S.B.user.foto = r.foto; } catch (e) {}
    };
    img.src = rd.result;
  };
  rd.readAsDataURL(f);
}
async function openSettings() { push('Pengaturan Aplikasi', pSettings); }
async function pSettings() {
  const t = loading(4); const list = await api('settings.get'); if (!alive(t)) return;
  view('<div class="card">' + list.map(s => fld(s.keterangan || s.kunci, inp('st_' + s.kunci, s.nilai, (s.devOnly && !P().dev ? 'disabled' : '') + ' data-k="' + s.kunci + '"') +
    '<div class="small muted" style="margin-top:3px">' + esc(s.kunci) + (s.devOnly ? ' • hanya Pengembang Aplikasi' : '') + '</div>')).join('') +
    '<button class="btn full" onclick="simpanSettings(this)">Simpan Pengaturan</button></div><div class="muted small" style="padding:0 4px">Semua pengaturan juga dapat diubah langsung di sheet "Pengaturan".</div>');
}
async function simpanSettings(btn) {
  const values = {}; $$('[data-k]').forEach(i => { if (!i.disabled) values[i.dataset.k] = i.value.trim(); });
  busy(btn, true);
  try { await run(() => api('settings.save', { values: values }), 'Pengaturan disimpan.'); S.B = await api('boot', {}, true); topBar(); } catch (e) {}
  busy(btn, false);
}
/* ---------- Logo (khusus Pengembang Aplikasi) ---------- */
function openLogo() { push('Logo Aplikasi & Kop Surat', pLogo, { sub: 'Khusus Pengembang Aplikasi' }); }
async function pLogo() {
  const t = loading(3);
  const L = await api('logo.get');
  if (!alive(t)) return;
  const box = src => '<div style="width:96px;height:96px;border-radius:18px;background:#fff;border:1px solid var(--line);display:grid;place-items:center;overflow:hidden;flex:none">' +
    (src ? '<img src="' + esc(src) + '" referrerpolicy="no-referrer" style="width:90%;height:90%;object-fit:contain">' : '<span class="small muted" style="text-align:center;padding:6px">Memakai logo Dayah</span>') + '</div>';
  const item = (j, judul, ket) => {
    const cur = L[j], src = cur || (j === 'dayah' ? L.bawaan : '');
    return '<div class="card"><div class="row" style="align-items:flex-start;gap:14px">' + box(src) + '<div class="grow"><div class="b">' + judul + '</div><div class="small muted" style="margin:3px 0 10px">' + ket + '</div>' +
      '<div class="small" style="margin-bottom:10px">' + (cur ? '<span class="st ok">Logo khusus</span>' : '<span class="st w">' + (j === 'dayah' ? 'Logo bawaan' : 'Belum diatur') + '</span>') + '</div>' +
      '<div class="row" style="flex-wrap:wrap;gap:6px"><label class="btn sm" style="cursor:pointer">' + ic('edit') + (cur || j === 'dayah' ? ' Ganti' : ' Tambah') + '<input type="file" accept="image/png,image/jpeg,image/webp" class="hide" onchange="unggahLogo(\'' + j + '\',this)"></label>' +
      (cur ? '<button class="btn sec sm" onclick="resetLogo(\'' + j + '\')">Kembalikan</button>' : '') + '</div></div></div></div>';
  };
  view('<div class="card row small" style="background:var(--soft)">' + ic('info') + '<span class="grow">Gunakan gambar persegi (PNG/JPG), minimal 300×300 piksel, latar putih atau transparan. Logo baru langsung dipakai di aplikasi dan dokumen PDF.</span></div>' +
    item('dayah', 'Logo Dayah', 'Halaman login, Tentang Aplikasi, kop raport Salafi, laporan iuran & uang tahunan.') +
    item('wustha', 'Logo PDF Wustha', 'Kop raport santri kelas Wustha. Bila kosong, memakai logo Dayah.') +
    item('ulya', 'Logo PDF Ulya', 'Kop raport santri kelas Ulya. Bila kosong, memakai logo Dayah.') +
    '<div class="muted small" style="padding:0 4px">Ikon aplikasi di layar HP mengikuti APK dan hanya berubah bila APK dibuat ulang.</div>');
}
function unggahLogo(jenis, input) {
  const f = input.files && input.files[0]; if (!f) return;
  const rd = new FileReader();
  rd.onload = () => {
    const img = new Image();
    img.onload = async () => {
      const max = 600, sc = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas'); c.width = Math.round(img.width * sc); c.height = Math.round(img.height * sc);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      const png = /png|webp/.test(f.type);
      const data = c.toDataURL(png ? 'image/png' : 'image/jpeg', .9);
      try { await run(() => api('logo.upload', { jenis: jenis, data: data }), 'Logo berhasil diganti.'); S.B = await api('boot', {}, true); refresh(); } catch (e) {}
    };
    img.onerror = () => toast('File bukan gambar yang valid.', 'err');
    img.src = rd.result;
  };
  rd.readAsDataURL(f);
}
async function resetLogo(jenis) {
  if (!(await ask(jenis === 'dayah' ? 'Kembalikan ke logo bawaan?' : 'Hapus logo ini? Kop PDF akan memakai logo Dayah.', 'Ya'))) return;
  try { await run(() => api('logo.reset', { jenis: jenis }), 'Logo dikembalikan.'); S.B = await api('boot', {}, true); refresh(); } catch (e) {}
}
function openTentang() {
  const s = S.B.settings;
  sheet('Tentang Aplikasi', '<div style="text-align:center;margin-bottom:12px"><div class="lg" style="width:76px;height:76px;margin:0 auto 8px;border-radius:22px;background:#fff;display:grid;place-items:center;box-shadow:var(--shadow);overflow:hidden">' + (s.logo ? '<img src="' + esc(s.logo) + '" style="width:64px;height:64px;object-fit:contain" referrerpolicy="no-referrer">' : LOGO_SVG) + '</div>' +
    '<div class="b" style="font-size:17px">' + esc(s.nama_aplikasi) + '</div><div class="small muted">Versi ' + esc(s.versi) + '</div></div>' +
    '<div class="card"><div class="list">' + [['Pemilik', s.tentang_pemilik], ['Alamat', s.tentang_alamat], ['Dibuat oleh', s.tentang_pembuat], ['Tanggal Revisi', s.tanggal_revisi], ['Penerbit', s.penerbit]]
      .map(x => '<div class="it" style="cursor:default"><div class="grow"><div class="s">' + x[0] + '</div><div class="t">' + esc(x[1]) + '</div></div></div>').join('') + '</div></div>');
}

/* =============================================================
 *  ROOM CHAT
 * ============================================================= */
function openChat() { push('Room Chat', pChat, { sub: 'Pesan pribadi antar pengguna' }); }
async function pChat() {
  const t = loading(6); const list = await api('chat.contacts'); if (!alive(t)) return;
  const withMsg = list.filter(c => c.last), others = list.filter(c => !c.last);
  const row = c => '<div class="it" data-q="' + esc((c.nama + ' ' + c.username + ' ' + (c.kelas || '')).toLowerCase()) + '" onclick="chatWith(\'' + esc(c.username) + '\')">' + avatar(c, 'sm') +
    '<div class="grow"><div class="row"><div class="t grow ell">' + esc(c.nama) + '</div>' + (c.last ? '<span class="small muted">' + (c.last.waktu.slice(0, 10) === todayStr() ? jam(c.last.waktu) : tgl(c.last.waktu)) + '</span>' : '') + '</div>' +
    '<div class="row"><div class="s grow ell">' + (c.last ? (c.last.dariSaya ? 'Anda: ' : '') + esc(c.last.pesan) : esc(c.tipe === 'Santri' ? c.kelas : (c.kabag || 'Dewan Guru'))) + '</div>' + (c.unread ? '<span class="ub">' + c.unread + '</span>' : '') + '</div></div></div>';
  view('<div class="search">' + ic('search') + '<input class="in" placeholder="Cari nama untuk memulai chat..." oninput="filterList(this.value)"></div><div class="card"><div class="list" id="fl">' +
    (withMsg.length ? '<div class="grp">Percakapan</div>' + withMsg.map(row).join('') : '') + '<div class="grp">Semua Pengguna</div>' + others.map(row).join('') + '</div></div>');
}
function chatWith(un) {
  closeSheet();
  const nama = userName(un);
  push(nama, () => pThread(un), { sub: 'Chat pribadi • @' + un, noNav: true, noChat: true });
}
async function pThread(un) {
  const t = loading(3);
  const msgs = await api('chat.thread', { with: un });
  if (!alive(t)) return;
  const real = msgs.filter(m => !m.pending);
  S.thread = { with: un, last: real.length ? real[real.length - 1].waktu : '', ids: {} };
  view('<div class="msgs" id="msgs"></div>');
  const v = $('#view'); v.style.paddingBottom = '10px';
  addMsgs(msgs);
  const c = document.createElement('div'); c.className = 'composer'; c.id = 'composer';
  c.innerHTML = '<textarea id="cm" placeholder="Tulis pesan..." rows="1"></textarea><button onclick="kirim()">' + ic('send') + '</button>';
  $('#app').appendChild(c);
  $('#cm').addEventListener('input', e => { e.target.style.height = '42px'; e.target.style.height = Math.min(110, e.target.scrollHeight) + 'px'; });
  S.polls.thread = setInterval(() => pollThread(t), 4000);
  pollUnread();
}
function addMsgs(msgs) {
  const box = $('#msgs'); if (!box) return;
  let lastDay = box.dataset.day || '';
  if (!msgs.length && !box.children.length) box.innerHTML = '<div class="dsep">Belum ada pesan. Mulai percakapan!</div>';
  msgs.forEach(m => {
    if (S.thread.ids[m.id]) { const e = box.querySelector('[data-id="' + m.id + '"]'); if (e && !m.pending && e.classList.contains('pend')) { e.classList.remove('pend'); e.querySelector('.tm').textContent = jam(m.waktu) + (m.dibaca ? ' ✓✓' : ' ✓'); } return; }
    S.thread.ids[m.id] = 1;
    const day = m.waktu.slice(0, 10);
    if (day !== lastDay) { box.insertAdjacentHTML('beforeend', '<div class="dsep">' + (day === todayStr() ? 'Hari ini' : tgl(day)) + '</div>'); lastDay = day; }
    box.insertAdjacentHTML('beforeend', '<div class="bb ' + (m.dariSaya ? 'me' : 'ot') + (m.pending ? ' pend' : '') + '" data-id="' + esc(m.id) + '">' + esc(m.pesan) + '<div class="tm">' + jam(m.waktu) + (m.pending ? ' 🕓 menunggu' : m.dariSaya ? (m.dibaca ? ' ✓✓' : ' ✓') : '') + '</div></div>');
    if (!m.pending && m.waktu > S.thread.last) S.thread.last = m.waktu;
  });
  box.dataset.day = lastDay;
  const v = $('#view'); v.scrollTop = v.scrollHeight;
}
async function pollThread(t) {
  if (!S.thread || !alive(t) || document.hidden || !isOnline()) return;
  try { const m = await api('chat.thread', { with: S.thread.with, since: S.thread.last }, true); if (alive(t)) addMsgs(m); } catch (e) {}
}
function stopThread() { if (S.polls.thread) { clearInterval(S.polls.thread); S.polls.thread = null; } S.thread = null; }
async function kirim() {
  const ta = $('#cm'); const p = ta.value.trim(); if (!p || !S.thread) return;
  ta.value = ''; ta.style.height = '42px'; ta.focus();
  try { const m = await api('chat.send', { to: S.thread.with, pesan: p }, true); const e = $('.dsep'); if (e && e.textContent.indexOf('Belum ada') === 0) e.remove(); addMsgs([m]); }
  catch (e) { toast(e.message, 'err'); ta.value = p; }
}
/* ---------- notifikasi pesan baru ---------- */
function startPolls() {
  stopPolls();
  pollUnread();
  S.polls.unread = setInterval(pollUnread, 20000);
  if (BR && BR.takeBack) S.polls.back = setInterval(() => { try { if (BR.takeBack()) { if (!back()) BR.exitApp(); } } catch (e) {} }, 200);
  try { if (!BR && window.Notification && Notification.permission === 'default') setTimeout(() => Notification.requestPermission(), 4000); } catch (e) {}
}
function stopPolls() { Object.keys(S.polls).forEach(k => { clearInterval(S.polls[k]); S.polls[k] = null; }); }
async function pollUnread() {
  if (!S.token || !S.B || document.hidden) return;
  if (!isOnline()) { setOnline(false); return; }
  if (Q.mine().some(x => !x.err)) flush();
  try {
    const r = await api('chat.unread', {}, true);
    const prev = S.unread; S.unread = r.count;
    if (r.count !== prev) topBar();
    const n = r.latest[0];
    if (n && n.id !== S.lastNotif && !(S.thread && S.thread.with.toLowerCase() === n.dari.toLowerCase())) {
      const seen = store.get('alhuda_notif');
      S.lastNotif = n.id;
      if (seen !== n.id) { store.set('alhuda_notif', n.id); notify('Pesan baru dari ' + n.nama, n.pesan, n.dari, n.id); }
    }
  } catch (e) {}
}
function notify(title, body, from, id) {
  try { if (BR && BR.notify) { BR.notify(title, body, String(id || '')); } else if (window.Notification && Notification.permission === 'granted') new Notification(title, { body: body }); } catch (e) {}
  const t = document.createElement('div'); t.className = 'toast ok'; t.style.cursor = 'pointer'; t.innerHTML = '<b>' + esc(title) + '</b><br>' + esc(body.slice(0, 80));
  t.onclick = () => { t.remove(); chatWith(from); }; document.body.appendChild(t); setTimeout(() => t.remove(), 5000);
}
document.addEventListener('visibilitychange', () => { if (!document.hidden && S.B) pollUnread(); });

/* ---------- mulai ---------- */
(function init() {
  try { BR && BR.ready && BR.ready(); } catch (e) {}
  applyTheme(store.get('alhuda_theme') || 'terang');
  let t = store.get('alhuda_token');
  try { if (!t && BR && BR.getToken) t = BR.getToken() || null; } catch (e) {}
  if (t) { S.token = t; startApp(); } else showLogin();
})();
</script>
