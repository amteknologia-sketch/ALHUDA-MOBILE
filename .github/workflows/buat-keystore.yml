name: Buat Keystore Play Store (sekali saja)

# Dijalankan MANUAL satu kali dari tab Actions. Menghasilkan kunci tanda tangan untuk Play Store.
on:
  workflow_dispatch:

jobs:
  keystore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Buat keystore
        run: |
          mkdir out
          PASS=$(openssl rand -base64 18 | tr -dc 'A-Za-z0-9' | head -c 20)
          keytool -genkeypair -v -keystore out/alhuda-upload.jks -storetype JKS \
            -alias alhuda -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$PASS" -keypass "$PASS" \
            -dname "CN=ALHUDA MOBILE, O=YPI Dayah Al-Huda Malikussaleh, C=ID"
          base64 -w 0 out/alhuda-upload.jks > out/ALHUDA_KEYSTORE_BASE64.txt
          {
            echo "SIMPAN FILE INI BAIK-BAIK (Google Drive pribadi + flashdisk). JANGAN dibagikan."
            echo ""
            echo "Isi GitHub Secrets (Settings > Secrets and variables > Actions > New repository secret):"
            echo "  ALHUDA_KEYSTORE_BASE64 = isi file ALHUDA_KEYSTORE_BASE64.txt"
            echo "  ALHUDA_KS_PASSWORD     = $PASS"
            echo "  ALHUDA_KEY_ALIAS       = alhuda"
            echo "  ALHUDA_KEY_PASSWORD    = $PASS"
          } > out/BACA_SAYA.txt

      - uses: actions/upload-artifact@v4
        with:
          name: KEYSTORE-ALHUDA-RAHASIA
          path: out/
          retention-days: 1
