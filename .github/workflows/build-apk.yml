name: Build APK ALHUDA MOBILE

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v3

      - name: Cek URL Web App sudah diisi
        run: |
          if grep -q "GANTI_DENGAN_ID_DEPLOYMENT" android/app/src/main/res/values/strings.xml; then
            echo "::error::URL Web App belum diisi di android/app/src/main/res/values/strings.xml"
            exit 1
          fi

      - name: Salin tampilan terbaru ke APK
        run: mkdir -p android/app/src/main/assets && cp apps-script/Index.html android/app/src/main/assets/index.html

      - name: Build APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon

      - name: Ganti nama file
        run: cp android/app/build/outputs/apk/debug/app-debug.apk ALHUDA-MOBILE.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ALHUDA-MOBILE-APK
          path: ALHUDA-MOBILE.apk
